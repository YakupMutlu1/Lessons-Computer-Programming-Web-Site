<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questions — Mesleki İngilizce</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/quiz.css">
  <style>
    .quiz-topbar { background: linear-gradient(90deg, #065f46, var(--surface)); }
    .btn-primary { background: #059669; }
    .progress-fill { background: linear-gradient(90deg, #059669, #22d3ee); }
    .quiz-layout-test-only { display: block; max-width: 900px; margin: 0 auto; }
    .quiz-layout-test-only .quiz-sidebar { display: none; }
    .quiz-main { padding: 1.5rem 2rem 3rem; }
    .test-only-badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: rgba(5, 150, 105, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 20px;
      font-size: 0.8rem;
      color: #a7f3d0;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body class="quiz-app">
  <header class="quiz-topbar">
    <div>
      <h1>Mesleki İngilizce — Question Bank</h1>
      <p class="test-only-badge">📝 Multiple choice only</p>
      <p style="margin-top:0.5rem;font-size:0.88rem">
        <a href="index.html" style="color:#a7f3d0">← Study notes</a> ·
        <a href="../index.html" style="color:#a7f3d0">Home</a>
      </p>
    </div>
    <div class="quiz-stats">
      <span>Total: <strong id="count-test">—</strong></span>
    </div>
  </header>
  <div class="quiz-layout quiz-layout-test-only">
    <main class="quiz-main">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="quiz-controls">
        <label>Topic: <select id="topic-filter"><option value="">All topics</option></select></label>
        <label><input type="checkbox" id="shuffle"> Shuffle questions</label>
        <button type="button" class="btn btn-primary" id="btn-check-page">Check This Page</button>
        <button type="button" class="btn btn-success" id="btn-check-all">Summary</button>
        <button type="button" class="btn btn-outline" id="btn-reset">Reset</button>
      </div>
      <div class="score-panel" id="score-panel"></div>
      <div id="loading" class="loading">Loading questions...</div>
      <div id="questions-container"></div>
      <nav class="pagination" id="pagination"></nav>
    </main>
  </div>
  <script>
    window.QUIZ_TEST_ONLY = true;
  </script>
  <script src="js/questions-data.js"></script>
  <script src="../js/quiz.js"></script>
</body>
</html>
